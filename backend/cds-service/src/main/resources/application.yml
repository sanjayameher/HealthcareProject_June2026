server:
  port: 7086

spring:
  application:
    name: cds-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:healthdb}
    username: ${DB_USER:svc_cds}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: dev
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: dev
    table: flyway_schema_history_cds
    # "dev" already has other services' tables, so Flyway needs explicit
    # permission to baseline it (baseline-on-migrate). baseline-version MUST be
    # below 1 (our first migration's version) — baselining at the default of 1
    # would mark V1 as "already applied" and skip it, leaving our tables uncreated.
    baseline-on-migrate: true
    baseline-version: 0
  cloud:
    discovery:
      enabled: false

cds:
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${CDS_LLM_MODEL:llama-3.3-70b-versatile}
    max-tokens: 2048
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${CDS_ANTHROPIC_MODEL:claude-opus-5}
    max-tokens: 2048
  ollama:
    url: ${OLLAMA_URL:http://localhost:11434}
    embedding-model: ${CDS_EMBEDDING_MODEL:nomic-embed-text}
    embedding-dimension: 768
  jwt:
    secret: ${JWT_SECRET:}
  services:
    patient-service-url: ${PATIENT_SERVICE_URL:http://localhost:7081}
    clinical-service-url: ${CLINICAL_SERVICE_URL:http://localhost:7082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
