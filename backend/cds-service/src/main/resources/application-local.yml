# LOCAL DEVELOPER PROFILE — DO NOT USE IN PRODUCTION
# Run with: mvn spring-boot:run "-Dspring-boot.run.profiles=local"

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/healthdb
    username: postgres
    password: "Aman2011$"
    hikari:
      connection-init-sql: "SET search_path TO dev, public"

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: dev

  flyway:
    enabled: true   # cds-service owns brand-new tables that don't exist yet in the shared DB
    locations: classpath:db/migration
    schemas: dev
    table: flyway_schema_history_cds
    baseline-on-migrate: true   # see application.yml for why this + baseline-version: 0 is required
    baseline-version: 0

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

cds:
  groq:
    api-key: ${GROQ_API_KEY:}
    model: llama-3.3-70b-versatile
    max-tokens: 2048
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5
    max-tokens: 2048
  ollama:
    url: http://localhost:11434
    embedding-model: nomic-embed-text
    embedding-dimension: 768
  jwt:
    secret: "local-dev-jwt-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm"
  services:
    patient-service-url: "http://localhost:7081"
    clinical-service-url: "http://localhost:7082"

logging:
  level:
    com.healthcare: DEBUG
    org.springframework.security: WARN
    com.netflix.eureka: OFF
    com.netflix.discovery: OFF
